{% extends "layout.html" %}

{% block content %}

<div class="pos-page">
  <div class="grid" style="grid-template-columns: 1fr; max-width: 700px;">

    <div class="card">
      <h2>Reports</h2>
      <p class="muted">Choose a report to view.</p>

      <div class="actions" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;">
        <a href="/daily_report">
          <button class="btn btn-primary">Daily Report</button>
        </a>

          {% if role != "staff" %}
          <a href="/monthly_overview">
           <button class="btn">Monthly Report</button>
          </a>
          {% endif %}

      </div>
    </div>

  </div>
</div>

{% endblock %}
